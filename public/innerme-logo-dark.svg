<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="640" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&amp;family=Inter:wght@500&amp;display=swap');
      .inner { font-family: Inter, Helvetica, sans-serif; font-weight: 500; font-size: 32px; letter-spacing: 3px; fill: #0f172a; }
      .me { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 400; font-size: 32px; fill: #0f172a; }
    </style>
  </defs>
  <text x="50%" y="48" text-anchor="middle">
    <tspan class="inner">INNER</tspan><tspan class="me">ME</tspan>
